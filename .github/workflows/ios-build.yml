name: Build iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS Simulator
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/ios \
            build

      - name: Show build files
        run: |
          echo "===== BUILD FILES ====="
          find build/ios -type f -maxdepth 8 | head -100
          echo "===== APP FILES ====="
          find build/ios -name "*.app" -print

      - name: Upload iOS App
        uses: actions/upload-artifact@v6
        with:
          name: ios-simulator-app
          path: build/ios/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
